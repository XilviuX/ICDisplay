name: "ICDisplay"
description: "Affiche les données Home Assistant sur un écran OLED SH1106 128x64 via I2C"
version: "2.5.0"
slug: "icdisplay"
init: false
arch:
  - aarch64
startup: application
boot: auto
map: []
options:
  ha_url: "http://172.16.137.11:8123"
  ha_token: ""
  i2c_bus: 1
  i2c_address: "0x3C"
  sensor_cpu: "sensor.system_monitor_utilisation_du_processeur"
  sensor_ram: "sensor.system_monitor_utilisation_de_la_memoire"
schema:
  ha_url: str
  ha_token: str
  i2c_bus: int
  i2c_address: str
  sensor_cpu: str
  sensor_ram: str
devices:
  - /dev/i2c-1
homeassistant_api: false
hassio_api: false
